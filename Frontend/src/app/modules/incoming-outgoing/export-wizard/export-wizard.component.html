<app-page-header
  [title]="(fileType === 'Incoming' ? 'incomingOutgoing.exportIncoming' : 'incomingOutgoing.exportOutgoing') | translate"
  [subtitle]="'incomingOutgoing.exportWizardSubtitle' | translate"
  [icon]="'fe fe-download'">
</app-page-header>

<div class="card">
  <div class="card-body">
    <form (ngSubmit)="export()">
      <!-- Filters Section -->
      <div class="mb-4">
        <h5 class="mb-3">{{ 'incomingOutgoing.filters' | translate }}</h5>
        <div class="row">
          <div class="col-md-3">
            <label>{{ 'incomingOutgoing.startDate' | translate }}</label>
            <input type="date" class="form-control" [(ngModel)]="filters.startDate" name="startDate">
          </div>
          <div class="col-md-3">
            <label>{{ 'incomingOutgoing.endDate' | translate }}</label>
            <input type="date" class="form-control" [(ngModel)]="filters.endDate" name="endDate">
          </div>
          <div class="col-md-2">
            <label>{{ 'incomingOutgoing.year' | translate }}</label>
            <input type="number" class="form-control" [(ngModel)]="filters.year" name="year" placeholder="YYYY">
          </div>
          <div class="col-md-2" *ngIf="fileType === 'Incoming'">
            <label>{{ 'incomingOutgoing.status' | translate }}</label>
            <select class="form-control" [(ngModel)]="filters.status" name="status">
              <option [value]="null">{{ 'common.all' | translate }}</option>
              <option value="Received">{{ 'incomingOutgoing.statusReceived' | translate }}</option>
              <option value="Processing">{{ 'incomingOutgoing.statusProcessing' | translate }}</option>
              <option value="Completed">{{ 'incomingOutgoing.statusCompleted' | translate }}</option>
              <option value="Closed">{{ 'incomingOutgoing.statusClosed' | translate }}</option>
            </select>
          </div>
          <div class="col-md-2">
            <label>&nbsp;</label>
            <button type="button" class="btn btn-outline-secondary btn-block" (click)="clearFilters()">
              <i class="fe fe-x mr-1"></i>
              {{ 'common.clear' | translate }}
            </button>
          </div>
        </div>
      </div>

      <!-- Fields Selection -->
      <div class="mb-4">
        <h5 class="mb-3">{{ 'incomingOutgoing.fieldsToExport' | translate }}</h5>
        <div class="form-group mb-2">
          <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="selectAllFields"
                   [checked]="areFieldsSelected()"
                   (change)="toggleAllFields($event)">
            <label class="custom-control-label" for="selectAllFields">
              {{ 'common.selectAll' | translate }}
            </label>
          </div>
        </div>
        <div class="row">
          <div class="col-md-4" *ngFor="let field of availableFields">
            <div class="custom-control custom-checkbox">
              <input type="checkbox" class="custom-control-input"
                     [id]="'field_' + field.key"
                     [(ngModel)]="field.selected"
                     name="fields">
              <label class="custom-control-label" [for]="'field_' + field.key">
                {{ field.label }}
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- Format Options -->
      <div class="mb-4">
        <h5 class="mb-3">{{ 'incomingOutgoing.formatOptions' | translate }}</h5>
        <div class="row">
          <div class="col-md-3">
            <label>{{ 'incomingOutgoing.fileFormat' | translate }}</label>
            <select class="form-control" [(ngModel)]="exportFormat" name="format">
              <option value="Excel">Excel (.xlsx)</option>
              <option value="PDF">PDF</option>
              <option value="CSV">CSV</option>
            </select>
          </div>
          <div class="col-md-3">
            <label>{{ 'incomingOutgoing.language' | translate }}</label>
            <select class="form-control" [(ngModel)]="language" name="language">
              <option value="Arabic">{{ 'incomingOutgoing.arabic' | translate }}</option>
              <option value="English">{{ 'incomingOutgoing.english' | translate }}</option>
              <option value="Both">{{ 'incomingOutgoing.both' | translate }}</option>
            </select>
          </div>
          <div class="col-md-3">
            <label>{{ 'incomingOutgoing.sortBy' | translate }}</label>
            <select class="form-control" [(ngModel)]="sortBy" name="sortBy">
              <option value="date">{{ 'incomingOutgoing.date' | translate }}</option>
              <option value="serial">{{ 'incomingOutgoing.serial' | translate }}</option>
              <option value="subject">{{ 'incomingOutgoing.subject' | translate }}</option>
              <option value="department">{{ 'incomingOutgoing.department' | translate }}</option>
            </select>
          </div>
          <div class="col-md-3">
            <label>{{ 'incomingOutgoing.sortOrder' | translate }}</label>
            <select class="form-control" [(ngModel)]="sortOrder" name="sortOrder">
              <option value="Ascending">{{ 'incomingOutgoing.ascending' | translate }}</option>
              <option value="Descending">{{ 'incomingOutgoing.descending' | translate }}</option>
            </select>
          </div>
        </div>
        <div class="form-group mt-3">
          <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="includeAttachments"
                   [(ngModel)]="includeAttachments" name="includeAttachments">
            <label class="custom-control-label" for="includeAttachments">
              {{ 'incomingOutgoing.includeAttachments' | translate }}
            </label>
            <small class="form-text text-muted">{{ 'incomingOutgoing.includeAttachmentsDesc' | translate }}</small>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="form-group mb-0">
        <button type="submit" class="btn btn-success" [disabled]="!areFieldsSelected() || exporting">
          <i class="fe fe-download mr-1"></i>
          {{ 'incomingOutgoing.generateExport' | translate }}
        </button>
        <button type="button" class="btn btn-outline-danger ml-2" (click)="cancel()">
          <i class="fe fe-x mr-1"></i>
          {{ 'common.cancel' | translate }}
        </button>
        <div *ngIf="exporting" class="spinner-border spinner-border-sm ml-2" role="status">
          <span class="sr-only">{{ 'common.loading' | translate }}</span>
        </div>
      </div>
    </form>
  </div>
</div>
