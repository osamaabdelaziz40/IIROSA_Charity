<app-breadcrumb [items]="breadcrumbs"></app-breadcrumb>
<app-page-header
  [title]="(isEditMode ? 'incomingOutgoing.editIncomingLetter' : 'incomingOutgoing.addIncomingLetter') | translate"
  [subtitle]="'incomingOutgoing.fillIncomingLetterDetails' | translate"
  [icon]="'fe fe-inbox'"
  [actions]="pageActions">
</app-page-header>

<div class="card" *ngIf="!loading">
  <div class="card-body">
    <form [formGroup]="letterForm" (ngSubmit)="onSubmit()">
      <div class="row">
        <!-- Serial (UC-COR-03 — advisory, server-allocated, read-only) -->
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label">{{ 'incomingOutgoing.serial' | translate }}</label>
            <input type="text" class="form-control" [value]="nextSerialTxt" readonly />
          </div>
        </div>

        <!-- Date (Required) -->
        <div class="col-md-4">
          <app-input-text
            [fg]="letterForm"
            fcn="date"
            [label]="'incomingOutgoing.date'"
            type="date"
            [required]="true">
          </app-input-text>
        </div>

        <!-- Letter Number (Required — review P3/P5) -->
        <div class="col-md-4">
          <app-input-text
            [fg]="letterForm"
            fcn="letterNumber"
            [label]="'incomingOutgoing.letterNumber'"
            [placeholder]="'incomingOutgoing.letterNumberPlaceholder' | translate"
            [required]="true">
          </app-input-text>
        </div>
      </div>

      <div class="row">
        <!-- Letter Date (Required — review P3/P5) -->
        <div class="col-md-4">
          <app-input-text
            [fg]="letterForm"
            fcn="letterDate"
            [label]="'incomingOutgoing.letterDate'"
            type="date"
            [required]="true">
          </app-input-text>
        </div>

        <!-- Department (Required — UC-COR-08) -->
        <div class="col-md-4">
          <app-drop-down
            [fg]="letterForm"
            fcn="departmentId"
            [label]="'incomingOutgoing.department'"
            [placeholder]="'incomingOutgoing.selectDepartment' | translate"
            [initialData]="departmentOptions">
          </app-drop-down>
        </div>

        <!-- Status (§21.S.1 tri-state, served by the endpoint) -->
        <div class="col-md-4">
          <app-drop-down
            [fg]="letterForm"
            fcn="status"
            [label]="'common.status'"
            [initialData]="statusOptions">
          </app-drop-down>
        </div>
      </div>

      <div class="row">
        <!-- Assigned Employee (Required) -->
        <div class="col-md-6">
          <app-drop-down
            [fg]="letterForm"
            fcn="assignedUserId"
            [label]="'incomingOutgoing.assignedEmployee'"
            [placeholder]="'incomingOutgoing.selectEmployee' | translate"
            [initialData]="employeeOptions">
          </app-drop-down>
        </div>

        <!-- Reply To Outgoing (Required) -->
        <div class="col-md-6">
          <app-drop-down
            [fg]="letterForm"
            fcn="outgoingId"
            [label]="'incomingOutgoing.replyToOutgoing'"
            [placeholder]="'incomingOutgoing.selectOutgoingLetter' | translate"
            [initialData]="outgoingLetterOptions">
          </app-drop-down>
        </div>
      </div>

      <!-- Subject (Required) -->
      <div class="row">
        <div class="col-md-12">
          <app-input-text
            [fg]="letterForm"
            fcn="subject"
            [label]="'incomingOutgoing.subject'"
            [placeholder]="'incomingOutgoing.subjectPlaceholder' | translate"
            [required]="true">
          </app-input-text>
        </div>
      </div>

      <!-- Letter Description (Required) -->
      <div class="row">
        <div class="col-md-12">
          <app-input-text
            [fg]="letterForm"
            fcn="letterDescription"
            [label]="'incomingOutgoing.letterDescription'"
            [placeholder]="'incomingOutgoing.letterDescriptionPlaceholder' | translate"
            type="textarea"
            [rows]="4"
            [required]="true">
          </app-input-text>
        </div>
      </div>

      <!-- File Attachment -->
      <div class="row">
        <div class="col-md-12">
          <label class="form-label">
            {{ 'incomingOutgoing.attachedFile' | translate }}
          </label>
          <app-attachment-input
            [fileType]="attachmentFileType.Document"
            [existingFileId]="attachmentFileId"
            (fileIdChange)="onAttachmentChange($event)"
            [acceptedFileTypes]="[attachmentFileType.Document]">
          </app-attachment-input>
        </div>
      </div>

      <!-- Form Actions -->
      <div class="row mt-4">
        <div class="col-md-12">
          <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-secondary" (click)="cancel()">
              <i class="fe fe-x mr-1"></i>
              {{ 'common.cancel' | translate }}
            </button>
            <button type="submit" class="btn btn-primary" [disabled]="saving">
              <i class="fe fe-save mr-1" *ngIf="!saving"></i>
              <i class="fe fe-spinner fe-spin mr-1" *ngIf="saving"></i>
              {{ saving ? ('common.saving' | translate) : ('common.save' | translate) }}
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Loading State -->
<div class="card" *ngIf="loading">
  <div class="card-body text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="sr-only">{{ 'common.loading' | translate }}</span>
    </div>
  </div>
</div>
