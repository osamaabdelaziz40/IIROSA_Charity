<app-breadcrumb [items]="breadcrumbs"></app-breadcrumb>
<app-page-header
  [title]="(isEditMode ? 'incomingOutgoing.editIncomingLetter' : 'incomingOutgoing.addIncomingLetter') | translate"
  [subtitle]="'incomingOutgoing.fillIncomingLetterDetails' | translate"
  [icon]="'fe fe-inbox'"
  [actions]="pageActions">
</app-page-header>

<!-- One collapsed accordion card per form section (shared app-collapsible-card);
     every field is a shared component — app-input-text / app-drop-down /
     app-attachment-input. -->
<div class="container-fluid" *ngIf="!loading">
  <form [formGroup]="letterForm" (ngSubmit)="onSubmit()">

    <!-- Letter Information Section -->
    <app-collapsible-card titleKey="incomingOutgoing.letterInformation" icon="fe-file-text">
        <div class="row">
          <!-- Serial (UC-COR-03 — advisory, server-allocated, read-only) -->
          <div class="col-md-4">
            <app-input-text
              [fg]="letterForm"
              fcn="serial"
              [label]="'incomingOutgoing.serial'"
              [readonly]="true"
              [helpText]="'incomingOutgoing.serialAutoAllocated'">
            </app-input-text>
          </div>

          <!-- Date (Required) -->
          <div class="col-md-4">
            <app-input-text
              [fg]="letterForm"
              fcn="date"
              [label]="'incomingOutgoing.date'"
              type="date"
              [required]="true">
            </app-input-text>
          </div>

          <!-- Letter Number (Required — review P3/P5) -->
          <div class="col-md-4">
            <app-input-text
              [fg]="letterForm"
              fcn="letterNumber"
              [label]="'incomingOutgoing.letterNumber'"
              [placeholder]="'incomingOutgoing.letterNumberPlaceholder' | translate"
              [required]="true">
            </app-input-text>
          </div>
        </div>

        <div class="row">
          <!-- Letter Date (Required — review P3/P5) -->
          <div class="col-md-4">
            <app-input-text
              [fg]="letterForm"
              fcn="letterDate"
              [label]="'incomingOutgoing.letterDate'"
              type="date"
              [required]="true">
            </app-input-text>
          </div>
        </div>
    </app-collapsible-card>

    <!-- Routing & Assignment Section (الإدارة · الحالة · الموظف المسؤول) -->
    <app-collapsible-card titleKey="incomingOutgoing.routingAndAssignment" icon="fe-users">
        <div class="row">
          <!-- Department (Required — UC-COR-08) -->
          <div class="col-md-4">
            <app-drop-down
              [fg]="letterForm"
              fcn="departmentId"
              [label]="'incomingOutgoing.department'"
              [placeholder]="'incomingOutgoing.selectDepartment' | translate"
              [initialData]="departmentOptions">
            </app-drop-down>
          </div>

          <!-- Status (§21.S.1 tri-state, served by the endpoint) -->
          <div class="col-md-4">
            <app-drop-down
              [fg]="letterForm"
              fcn="status"
              [label]="'common.status'"
              [initialData]="statusOptions">
            </app-drop-down>
          </div>

          <!-- Assigned User (Required) -->
          <div class="col-md-4">
            <app-drop-down
              [fg]="letterForm"
              fcn="assignedUserId"
              [label]="'incomingOutgoing.assignedEmployee'"
              [placeholder]="'incomingOutgoing.selectEmployee' | translate"
              [initialData]="userOptions">
            </app-drop-down>
          </div>
        </div>
    </app-collapsible-card>

    <!-- Letter Content Section -->
    <app-collapsible-card titleKey="incomingOutgoing.letterContent" icon="fe-edit-3">
        <!-- Subject (Required) -->
        <div class="row">
          <div class="col-md-12">
            <app-input-text
              [fg]="letterForm"
              fcn="subject"
              [label]="'incomingOutgoing.subject'"
              [placeholder]="'incomingOutgoing.subjectPlaceholder' | translate"
              [required]="true">
            </app-input-text>
          </div>
        </div>

        <!-- Letter Description (Required) -->
        <div class="row">
          <div class="col-md-12">
            <app-input-text
              [fg]="letterForm"
              fcn="letterDescription"
              [label]="'incomingOutgoing.letterDescription'"
              [placeholder]="'incomingOutgoing.letterDescriptionPlaceholder' | translate"
              type="textarea"
              [rows]="4"
              [required]="true">
            </app-input-text>
          </div>
        </div>
    </app-collapsible-card>

    <!-- Attachments Section -->
    <app-collapsible-card titleKey="incomingOutgoing.attachments" icon="fe-paperclip">
        <div class="row">
          <div class="col-md-12">
            <app-attachment-input
              [labelKey]="'incomingOutgoing.attachedFile'"
              [fileType]="attachmentFileType.Document"
              [existingFileId]="attachmentFileId"
              (fileIdChange)="onAttachmentChange($event)"
              [acceptedFileTypes]="[attachmentFileType.Document]">
            </app-attachment-input>
          </div>
        </div>
    </app-collapsible-card>

    <!-- Form Actions (always visible — not a collapsible section) -->
    <div class="card shadow mb-4">
      <div class="card-body d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-secondary" (click)="cancel()">
          <i class="fe fe-x mr-1"></i>
          {{ 'common.cancel' | translate }}
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="saving">
          <i class="fe fe-save mr-1" *ngIf="!saving"></i>
          <i class="fe fe-spinner fe-spin mr-1" *ngIf="saving"></i>
          {{ saving ? ('common.saving' | translate) : ('common.save' | translate) }}
        </button>
      </div>
    </div>
  </form>
</div>

<!-- Loading State -->
<div class="card" *ngIf="loading">
  <div class="card-body text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="sr-only">{{ 'common.loading' | translate }}</span>
    </div>
  </div>
</div>
