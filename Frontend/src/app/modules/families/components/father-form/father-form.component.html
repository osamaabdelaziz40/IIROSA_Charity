<div class="card mb-3">
  <div class="card-header section-toggle d-flex justify-content-between align-items-center" role="button"
       (click)="toggleCard()" [attr.aria-expanded]="expanded" aria-controls="father-card-body">
    <h4 class="mb-0">
      {{ 'families.fatherInformation' | translate }}
      <span class="text-danger">*</span>
    </h4>
    <div class="d-flex align-items-center">
      <button type="button" class="btn btn-sm btn-primary mr-2" *ngIf="familyId"
              (click)="$event.stopPropagation(); expanded = true; save.emit()">
        <i class="fe fe-save mr-1"></i>
        {{ 'common.save' | translate }}
      </button>
      <i class="fe" [class.fe-chevron-down]="expanded" [class.fe-chevron-left]="!expanded"></i>
    </div>
  </div>
  <div id="father-card-body" class="card-body collapse" [class.show]="expanded">
    <form [formGroup]="fatherForm">
      <div class="row">
        <div class="col-md-6">
          <app-input-text
            [fg]="fatherForm"
            fcn="fullName"
            [label]="'families.fullName'"
            [required]="true"
            [placeholder]="'families.fullNamePlaceholder' | translate">
          </app-input-text>
        </div>
        <div class="col-md-6">
          <app-input-text
            [fg]="fatherForm"
            fcn="nationalId"
            [label]="'families.nationalId'"
            [required]="true"
            [placeholder]="'families.nationalIdPlaceholder' | translate">
          </app-input-text>
        </div>
      </div>

      <!-- §10 اضافة معيل — four-part name -->
      <div class="row">
        <div class="col-md-3">
          <app-input-text
            [fg]="fatherForm"
            fcn="firstName"
            [label]="'families.firstName'"
            [placeholder]="'families.firstNamePlaceholder' | translate">
          </app-input-text>
        </div>
        <div class="col-md-3">
          <app-input-text
            [fg]="fatherForm"
            fcn="secondName"
            [label]="'families.secondName'"
            [placeholder]="'families.secondNamePlaceholder' | translate">
          </app-input-text>
        </div>
        <div class="col-md-3">
          <app-input-text
            [fg]="fatherForm"
            fcn="thirdName"
            [label]="'families.thirdName'"
            [placeholder]="'families.thirdNamePlaceholder' | translate">
          </app-input-text>
        </div>
        <div class="col-md-3">
          <app-input-text
            [fg]="fatherForm"
            fcn="familyName"
            [label]="'families.familyName'"
            [placeholder]="'families.familyNamePlaceholder' | translate">
          </app-input-text>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <app-drop-down [fg]="fatherForm"
                         fcn="nationalityCountryId"
                         [label]="'families.nationality'"
                         [placeholder]="'families.selectNationality' | translate"
                         [initialData]="nationalityOptions">
          </app-drop-down>
        </div>
        <div class="col-md-4">
          <app-input-text
            [fg]="fatherForm"
            fcn="dateOfBirth"
            type="date"
            [label]="'families.dateOfBirth'"
            [required]="true">
          </app-input-text>
        </div>
        <div class="col-md-4">
          <app-input-text
            [fg]="fatherForm"
            fcn="placeOfBirth"
            [label]="'families.placeOfBirth'"
            [placeholder]="'families.placeOfBirthPlaceholder' | translate">
          </app-input-text>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <app-input-text
            [fg]="fatherForm"
            fcn="job"
            [label]="'families.job'"
            [placeholder]="'families.jobPlaceholder' | translate">
          </app-input-text>
        </div>
        <div class="col-md-4">
          <app-input-text
            [fg]="fatherForm"
            fcn="monthlyIncome"
            type="number"
            [label]="'families.monthlyIncome'">
          </app-input-text>
        </div>
        <div class="col-md-4">
          <app-drop-down [fg]="fatherForm"
                         fcn="healthStatusId"
                         [label]="'families.healthStatus'"
                         [placeholder]="'families.selectHealthStatus' | translate"
                         [initialData]="healthStatusOptions">
          </app-drop-down>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <app-input-text
            [fg]="fatherForm"
            fcn="mezaCard"
            [label]="'families.mezaCard'"
            [placeholder]="'families.mezaCardPlaceholder' | translate">
          </app-input-text>
        </div>
        <div class="col-md-4">
          <app-input-text
            [fg]="fatherForm"
            fcn="mezaCardExpirationDate"
            type="date"
            [label]="'families.mezaCardExpirationDate'">
          </app-input-text>
        </div>
        <div class="col-md-4">
          <app-input-text
            [fg]="fatherForm"
            fcn="phone"
            [label]="'families.phone'"
            [placeholder]="'families.phonePlaceholder' | translate">
          </app-input-text>
          <!-- UC-ORP-10 — duplicate-phone flag -->
          <small class="text-danger d-block mt-1"
                 *ngIf="phoneCheck?.status === 'duplicate'">
            <i class="fe fe-alert-circle"></i>
            {{ 'orphanCoding.phoneDuplicate' | translate }}
            <span *ngIf="phoneCheck?.holderLabel">
              ({{ 'orphanCoding.phoneHeldBy' | translate }}: {{ phoneCheck?.holderLabel }})
            </span>
          </small>
          <small class="text-muted d-block mt-1"
                 *ngIf="phoneCheck?.status === 'checking'">
            {{ 'orphanCoding.phoneChecking' | translate }}...
          </small>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 d-flex align-items-center">
          <div class="custom-control custom-checkbox mr-3">
            <input type="checkbox" class="custom-control-input" id="fatherIsDead" formControlName="isDead">
            <label class="custom-control-label" for="fatherIsDead">{{ 'families.isDead' | translate }}</label>
          </div>
          <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="fatherIsProvider" formControlName="isProvider">
            <label class="custom-control-label" for="fatherIsProvider">{{ 'families.isProvider' | translate }}</label>
          </div>
        </div>
      </div>

      <!-- §10 death details — shown while متوفى is checked -->
      <div class="row" *ngIf="fatherForm.get('isDead')?.value">
        <div class="col-md-4">
          <app-input-text
            [fg]="fatherForm"
            fcn="deathDate"
            type="date"
            [label]="'families.deathDate'"
            [required]="true">
          </app-input-text>
        </div>
        <div class="col-md-4">
          <app-drop-down [fg]="fatherForm"
                         fcn="deathReasonId"
                         [label]="'families.deathReason'"
                         [placeholder]="'families.selectDeathReason' | translate"
                         [initialData]="deathReasonOptions">
          </app-drop-down>
        </div>
        <div class="col-md-4">
          <label class="form-label">{{ 'families.deathCertificate' | translate }}</label>
          <div *ngIf="!deathCertificate">
            <input type="file"
                   class="form-control"
                   id="fatherDeathCertificateFile"
                   (change)="onDeathCertificateChange($event)">
          </div>
          <div *ngIf="deathCertificate" class="d-flex align-items-center">
            <span class="text-truncate d-inline-block mr-2" style="max-width: 220px;"
                  [title]="deathCertificate.fileName">
              <i class="fe fe-paperclip"></i> {{ deathCertificate.fileName }}
            </span>
            <button type="button" class="btn btn-sm btn-outline-danger" (click)="deathCertificateRemoved.emit()">
              <i class="fe fe-x"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-12">
          <app-input-text
            [fg]="fatherForm"
            fcn="notes"
            type="textarea"
            [label]="'families.notes'"
            [rows]="2">
          </app-input-text>
        </div>
      </div>
    </form>
  </div>
</div>
