<div class="card mb-3">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h4 class="mb-0">
      {{ 'families.fatherInformation' | translate }}
      <span class="text-danger">*</span>
    </h4>
    <button type="button" class="btn btn-sm btn-primary" *ngIf="familyId" (click)="save.emit()">
      <i class="fe fe-save mr-1"></i>
      {{ 'common.save' | translate }}
    </button>
  </div>
  <div class="card-body">
    <form [formGroup]="fatherForm">
      <div class="row">
        <div class="col-md-6">
          <app-input-text
            [fg]="fatherForm"
            fcn="fullName"
            [label]="'families.fullName'"
            [required]="true"
            [placeholder]="'families.fullNamePlaceholder' | translate">
          </app-input-text>
        </div>
        <div class="col-md-6">
          <app-input-text
            [fg]="fatherForm"
            fcn="nationalId"
            [label]="'families.nationalId'"
            [required]="true"
            [placeholder]="'families.nationalIdPlaceholder' | translate">
          </app-input-text>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <app-input-text
            [fg]="fatherForm"
            fcn="dateOfBirth"
            type="date"
            [label]="'families.dateOfBirth'"
            [required]="true">
          </app-input-text>
        </div>
        <div class="col-md-4">
          <app-input-text
            [fg]="fatherForm"
            fcn="placeOfBirth"
            [label]="'families.placeOfBirth'"
            [placeholder]="'families.placeOfBirthPlaceholder' | translate">
          </app-input-text>
        </div>
        <div class="col-md-4">
          <app-drop-down
            [fg]="fatherForm"
            fcn="educationLevel"
            [label]="'families.educationLevel'"
            [initialData]="educationLevelOptions"
            [hasDefaultValue]="true">
          </app-drop-down>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <app-input-text
            [fg]="fatherForm"
            fcn="job"
            [label]="'families.job'"
            [placeholder]="'families.jobPlaceholder' | translate">
          </app-input-text>
        </div>
        <div class="col-md-4">
          <app-input-text
            [fg]="fatherForm"
            fcn="monthlyIncome"
            type="number"
            [label]="'families.monthlyIncome'">
          </app-input-text>
        </div>
        <div class="col-md-4">
          <app-drop-down
            [fg]="fatherForm"
            fcn="healthStatus"
            [label]="'families.healthStatus'"
            [initialData]="healthStatusOptions"
            [hasDefaultValue]="true">
          </app-drop-down>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <app-input-text
            [fg]="fatherForm"
            fcn="phone"
            [label]="'families.phone'"
            [placeholder]="'families.phonePlaceholder' | translate">
          </app-input-text>
          <!-- UC-ORP-10 — duplicate-phone flag -->
          <small class="text-danger d-block mt-1"
                 *ngIf="phoneCheck?.status === 'duplicate'">
            <i class="fe fe-alert-circle"></i>
            {{ 'orphanCoding.phoneDuplicate' | translate }}
            <span *ngIf="phoneCheck?.holderLabel">
              ({{ 'orphanCoding.phoneHeldBy' | translate }}: {{ phoneCheck?.holderLabel }})
            </span>
          </small>
          <small class="text-muted d-block mt-1"
                 *ngIf="phoneCheck?.status === 'checking'">
            {{ 'orphanCoding.phoneChecking' | translate }}...
          </small>
        </div>
        <div class="col-md-4">
          <app-input-text
            [fg]="fatherForm"
            fcn="deathDate"
            type="date"
            [label]="'families.deathDate'">
          </app-input-text>
        </div>
        <div class="col-md-4 d-flex align-items-center">
          <div class="custom-control custom-checkbox mr-3">
            <input type="checkbox" class="custom-control-input" id="fatherIsAlive" formControlName="isAlive">
            <label class="custom-control-label" for="fatherIsAlive">{{ 'families.isAlive' | translate }}</label>
          </div>
          <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="fatherIsProvider" formControlName="isProvider">
            <label class="custom-control-label" for="fatherIsProvider">{{ 'families.isProvider' | translate }}</label>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-12">
          <app-input-text
            [fg]="fatherForm"
            fcn="notes"
            type="textarea"
            [label]="'families.notes'"
            [rows]="2">
          </app-input-text>
        </div>
      </div>
    </form>
  </div>
</div>
