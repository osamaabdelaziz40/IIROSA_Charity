<app-breadcrumb [items]="breadcrumbsWithAction"></app-breadcrumb>
<app-page-header
  [title]="pageTitleKey"
  [actions]="pageActions">
</app-page-header>

<!-- Every field is a shared component (app-input-text / app-drop-down) per the
     platform rule; the two audience flags are the only plain checkboxes. -->
<div class="container-fluid" *ngIf="!loading">
  <form [formGroup]="notificationForm" (ngSubmit)="onSubmit()">

    <!-- Content Section -->
    <app-collapsible-card titleKey="notifications.content" icon="fe-info">
      <div class="row">
        <div class="col-md-12">
          <div class="form-group">
            <label>{{ 'notifications.titleLabel' | translate }} <span class="text-danger">*</span></label>
            <input type="text" class="form-control" formControlName="title" maxlength="250"
                   [class.is-invalid]="!!fieldError('title')"
                   [placeholder]="'notifications.titlePlaceholder' | translate" />
            <div class="invalid-feedback" *ngIf="fieldError('title') as err">{{ err }}</div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-12">
          <div class="form-group">
            <label>{{ 'notifications.message' | translate }} <span class="text-danger">*</span></label>
            <textarea class="form-control" formControlName="message" rows="5" maxlength="4000"
                      [class.is-invalid]="!!fieldError('message')"
                      [placeholder]="'notifications.messagePlaceholder' | translate"></textarea>
            <div class="invalid-feedback" *ngIf="fieldError('message') as err">{{ err }}</div>
          </div>
        </div>
      </div>
    </app-collapsible-card>

    <!-- Audience Section (isUser / isCharity + the multi-selects they gate) -->
    <app-collapsible-card titleKey="notifications.audience" icon="fe-users">
      <div class="row mb-3">
        <div class="col-md-6">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="isUserFlag" formControlName="isUser"
                   [class.is-invalid]="!!targetError">
            <label class="form-check-label" for="isUserFlag">{{ 'notifications.isUser' | translate }}</label>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="isCharityFlag" formControlName="isCharity"
                   [class.is-invalid]="!!targetError">
            <label class="form-check-label" for="isCharityFlag">{{ 'notifications.isCharity' | translate }}</label>
          </div>
        </div>
      </div>
      <!-- Row-level guard: a notification addressed to nobody is a silent no-op -->
      <div class="row" *ngIf="targetError as err">
        <div class="col-md-12">
          <div class="invalid-feedback d-block">{{ err }}</div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6" *ngIf="notificationForm.get('isUser')?.value">
          <app-drop-down [fg]="notificationForm"
                         fcn="recipientUserIds"
                         [label]="'notifications.selectUsers'"
                         [placeholder]="'notifications.selectUsersPlaceholder' | translate"
                         [initialData]="userOptions"
                         [multiple]="true">
          </app-drop-down>
        </div>
        <div class="col-md-6" *ngIf="notificationForm.get('isCharity')?.value">
          <app-drop-down [fg]="notificationForm"
                         fcn="recipientCharityIds"
                         [label]="'notifications.selectCharities'"
                         [placeholder]="'notifications.selectCharitiesPlaceholder' | translate"
                         [initialData]="charityOptions"
                         [multiple]="true">
          </app-drop-down>
        </div>
      </div>
    </app-collapsible-card>

    <!-- Form Actions (always visible — not a collapsible section) -->
    <div class="card shadow mb-4">
      <div class="card-body">
        <button type="submit" class="btn btn-primary" [disabled]="saving">
          <i class="fe fe-send mr-1" *ngIf="!saving"></i>
          <span class="spinner-border spinner-border-sm mr-1" *ngIf="saving"></span>
          {{ (isEditMode ? 'common.save' : 'notifications.send') | translate }}
        </button>
        <!-- UC-NTF resend: re-push the stored content — edit-mode only -->
        <button *ngIf="isEditMode" type="button" class="btn btn-info ml-2" [disabled]="resending" (click)="onResend()">
          <i class="fe fe-repeat mr-1" *ngIf="!resending"></i>
          <span class="spinner-border spinner-border-sm mr-1" *ngIf="resending"></span>
          {{ 'notifications.resend' | translate }}
        </button>
        <button type="button" class="btn btn-secondary ml-2" (click)="onCancel()" [disabled]="saving">
          <i class="fe fe-x mr-1"></i>
          {{ 'common.cancel' | translate }}
        </button>
      </div>
    </div>
  </form>
</div>

<!-- Loading State -->
<div *ngIf="loading" class="text-center py-5">
  <div class="spinner-border text-primary" role="status">
    <span class="sr-only">{{ 'common.loading' | translate }}</span>
  </div>
  <p class="mt-3 text-muted">{{ 'common.loading' | translate }}...</p>
</div>
