<app-page-header
  [title]="'employees.assignRole'"
  [actions]="pageActions">
</app-page-header>

<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <!-- Employee Info Alert -->
      <div class="alert alert-info" *ngIf="employeeName && !loading">
        <i class="fe fe-user"></i>
        {{ 'employees.assigningRoleFor' | translate }}: <strong>{{ employeeName }}</strong>
      </div>

      <div class="card shadow mb-4">
        <div class="card-body">
          <!-- Loading State -->
          <div class="text-center py-5" *ngIf="loading">
            <div class="spinner-border text-primary" role="status">
              <span class="sr-only">{{ 'common.loading' | translate }}</span>
            </div>
            <p class="mt-3 text-muted">{{ 'common.loading' | translate }}...</p>
          </div>

          <!-- Role Selection -->
          <div *ngIf="!loading">
            <form [formGroup]="roleForm">
              <div class="row">
                <div class="col-md-6">
                  <app-drop-down
                    [fg]="roleForm"
                    fcn="roleName"
                    [label]="'userManagement.role'"
                    [initialData]="roleOptions"
                    [placeholder]="'validation.selectAnOption' | translate">
                  </app-drop-down>

                  <div class="form-group">
                    <button type="button" class="btn btn-primary" (click)="onSubmit()" [disabled]="submitting">
                      <span *ngIf="!submitting">
                        <i class="fe fe-check"></i>
                        {{ 'userManagement.assignRoles' | translate }}
                      </span>
                      <span *ngIf="submitting" class="spinner-border spinner-border-sm mr-2"></span>
                      <span *ngIf="submitting">{{ 'common.processing' | translate }}</span>
                    </button>
                    <button type="button" class="btn btn-secondary ml-2" (click)="cancel()" [disabled]="submitting">
                      <i class="fe fe-x mr-1"></i>
                      {{ 'common.cancel' | translate }}
                    </button>
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="card bg-light">
                    <div class="card-body">
                      <h6>{{ 'common.info' | translate }}</h6>
                      <p class="text-muted mb-0">
                        <i class="fe fe-info-circle"></i>
                        {{ 'employees.assignRoleInfo' | translate }}
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
