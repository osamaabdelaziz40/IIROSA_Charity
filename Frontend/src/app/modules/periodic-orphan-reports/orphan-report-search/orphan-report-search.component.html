<div class="orphan-report-search">
  <app-page-header
    [title]="'periodicReports.search.title' | translate"
    [subtitle]="'periodicReports.search.subtitle' | translate"
    [icon]="'fas fa-search'">
  </app-page-header>

  <!-- §14.S.4 filters: الجمعية · And/Or · نوع التعليم · الحالة الصحية · الحالة الاجتماعية ·
       الحالة التعليمية · المرحلة الدراسية · اخر تقدير (الصف الدراسي gap: no stage lookup on this stack) -->
  <div class="card mb-3">
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <!-- الجمعية — HQ only (a charity caller is server-pinned to its own rows) -->
        <div class="col-md-3" *ngIf="isHeadOffice">
          <label class="form-label" translate>periodicReports.filters.charity</label>
          <select class="form-select" [(ngModel)]="charityId" (change)="search()">
            <option value="" translate>periodicReports.filters.allCharities</option>
            <option *ngFor="let charity of charities; trackBy: trackByCharityId" [ngValue]="charity.id">
              {{ charity.name }}
            </option>
          </select>
        </div>

        <!-- And / Or radio — how the status predicates combine (legacy OrphanStatusRefinedContract) -->
        <div class="col-md-3">
          <label class="form-label d-block" translate>periodicReports.search.combine</label>
          <div class="btn-group" role="group">
            <input type="radio" class="btn-check" name="andOr" id="andOrAnd" value="and" [(ngModel)]="andOr">
            <label class="btn btn-outline-primary" for="andOrAnd" translate>periodicReports.search.and</label>
            <input type="radio" class="btn-check" name="andOr" id="andOrOr" value="or" [(ngModel)]="andOr">
            <label class="btn btn-outline-primary" for="andOrOr" translate>periodicReports.search.or</label>
          </div>
        </div>

        <!-- نوع التعليم -->
        <div class="col-md-2">
          <label class="form-label" translate>periodicReports.search.schoolType</label>
          <select class="form-select" [(ngModel)]="schoolType" (change)="search()">
            <option value="" translate>common.all</option>
            <option value="حكومي" translate>periodicReports.search.schoolTypeGovernment</option>
            <option value="أهلي" translate>periodicReports.search.schoolTypePrivate</option>
          </select>
        </div>

        <!-- الحالة الصحية -->
        <div class="col-md-2">
          <label class="form-label" translate>periodicReports.search.medicalStatus</label>
          <select class="form-select" [(ngModel)]="medicalStatus" (change)="search()">
            <option value="" translate>common.all</option>
            <option value="سليم" translate>periodicReports.search.medicalHealthy</option>
            <option value="معاق" translate>periodicReports.search.medicalDisabled</option>
            <option value="مريض" translate>periodicReports.search.medicalSick</option>
          </select>
        </div>

        <!-- الحالة الاجتماعية -->
        <div class="col-md-2">
          <label class="form-label" translate>periodicReports.search.maritalStatus</label>
          <select class="form-select" [(ngModel)]="maritalStatus" (change)="search()">
            <option value="" translate>common.all</option>
            <option value="married" translate>periodicReports.search.maritalMarried</option>
            <option value="single" translate>periodicReports.search.maritalSingle</option>
            <option value="deceased" translate>periodicReports.search.maritalDeceased</option>
          </select>
        </div>

        <!-- الحالة التعليمية -->
        <div class="col-md-2">
          <label class="form-label" translate>periodicReports.search.educationalStatus</label>
          <select class="form-select" [(ngModel)]="educationalStatus" (change)="search()">
            <option value="" translate>common.all</option>
            <option value="studying" translate>periodicReports.search.eduStudying</option>
            <option value="graduated" translate>periodicReports.search.eduGraduated</option>
            <option value="dropout" translate>periodicReports.search.eduDropout</option>
          </select>
        </div>

        <!-- المرحلة الدراسية -->
        <div class="col-md-2">
          <label class="form-label" translate>periodicReports.search.educationalLevel</label>
          <select class="form-select" [(ngModel)]="educationalLevelId" (change)="search()">
            <option value="" translate>common.all</option>
            <option *ngFor="let level of educationLevels; trackBy: trackByLevelId" [ngValue]="level.id">
              {{ level.name }}
            </option>
          </select>
        </div>

        <!-- اخر تقدير -->
        <div class="col-md-2">
          <label class="form-label" translate>periodicReports.search.educationDegree</label>
          <select class="form-select" [(ngModel)]="educationDegree" (change)="search()">
            <option value="" translate>common.all</option>
            <option value="ممتاز" translate>periodicReports.search.degreeExcellent</option>
            <option value="جيد جدا" translate>periodicReports.search.degreeVeryGood</option>
            <option value="جيد" translate>periodicReports.search.degreeGood</option>
            <option value="مقبول" translate>periodicReports.search.degreeFair</option>
            <option value="ضعيف" translate>periodicReports.search.degreeWeak</option>
          </select>
        </div>

        <!-- بحث -->
        <div class="col-md-2 text-start">
          <button class="btn btn-primary" (click)="search()">
            <i class="fas fa-search me-1"></i>
            <span translate>periodicReports.filters.search</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <app-loading *ngIf="loading"></app-loading>

  <!-- §14.S.4 wide grid — 38 spec columns, horizontal scroll -->
  <div class="card" *ngIf="!loading">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span translate>periodicReports.search.results</span>
      <button class="btn btn-sm btn-outline-success" (click)="exportData()" [disabled]="exporting || totalCount === 0">
        <i class="fas" [class.fa-spinner]="exporting" [class.fa-spin]="exporting" [class.fa-file-excel]="!exporting"></i>
        <span class="ms-1" translate>periodicReports.search.export</span>
      </button>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive wide-grid">
        <table class="table table-hover table-sm mb-0 text-nowrap">
          <thead>
            <tr>
              <th *ngFor="let col of columns; trackBy: trackByColumnKey">{{ 'periodicReports.search.columns.' + col.key | translate }}</th>
              <th translate>common.actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let report of reports; trackBy: trackByReportId">
              <td *ngFor="let col of columns; trackBy: trackByColumnKey">{{ col.value(report) || '—' }}</td>
              <td>
                <a class="btn btn-light btn-sm" [routerLink]="['/periodic-orphan-reports', report.id]"
                   [title]="'common.view' | translate">
                  <i class="fas fa-eye"></i>
                </a>
                <!-- §23.S.1 مراجعة — HQ reviewers only; the review screen enforces the refuse-reason rule -->
                <a class="btn btn-outline-primary btn-sm ms-1" *ngIf="auth.hasPermission('PeriodicReports.Review')"
                   [routerLink]="['/periodic-orphan-reports', report.id, 'review']"
                   [title]="'periodicReports.search.review' | translate">
                  <i class="fas fa-check-double"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <app-empty-state
        *ngIf="reports.length === 0"
        [icon]="'fas fa-search'"
        [title]="'periodicReports.search.emptyTitle' | translate"
        [description]="'periodicReports.search.emptyMessage' | translate">
      </app-empty-state>
    </div>

    <div class="card-footer" *ngIf="totalCount > 0">
      <app-pagination
        [totalCount]="totalCount"
        [pageSize]="pageSize"
        [currentPage]="currentPage"
        (pageChange)="onPageChange($event)">
      </app-pagination>
    </div>
  </div>
</div>
