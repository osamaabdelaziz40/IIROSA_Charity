# IIROSA Charities — Orphan Sponsorship & Family Welfare Management System
# Sprint status / delivery backlog, in the BMAD implementation-artifacts format.
#
# generated: 2026-08-18
# last_updated: 2026-08-18  # RE-PLATFORM BASELINE.
#
#   This board is the delivery backlog for the NEW system: .NET 8 Clean Architecture + Angular 18,
#   per _bmad-output/planning-artifacts/architecture.md.
#
#   Every story imports at `backlog`. The functional scope is inherited from the documented
#   WAR.IIROSA use case catalogue, but NONE of it is built on this stack yet. Where a story was
#   already implemented in the legacy AngularJS / .NET Framework 4.8 system, its comment is tagged
#   `legacy: implemented` — that means "a working reference implementation exists to read", NOT
#   "done here". Stories tagged `NEW` have no legacy equivalent at all.
#
# SCOPE: 19 epics · 232 stories · 859 points (relative sizing, not a schedule).
#   230 stories carry a legacy reference implementation. 2 are genuinely new (21 pts):
#     1-10-issue-a-jwt-access-token-on-login  — epic-1 Authentication & User Account
#     1-11-refresh-an-expired-access-token    — epic-1 Authentication & User Account
#   Story keys are <epic>-<n>-<kebab-title>. The trailing comment on every story carries its use
#   case id, MoSCoW priority, size and the legacy endpoint that realised it, so the board stays
#   traceable to the specification.
#
# STATUS VALUES:
#   Epic:  backlog | in-progress | done
#   Story: backlog | ready-for-dev | in-progress | review | done
#   Retro: optional | done
#   Mark an epic `in-progress` when work starts on its first story.
#
# SPECIFICATION: each epic maps to one module document under docs/Modules/:
#   §<ch>.S  screen field specification (every field, binding, control, mandatory flag, lookup)
#   §<ch>.U  one expanded use case scenario (trigger, pre-conditions, main flow, alternates,
#            exceptions, post-conditions, realisation)
#   Acceptance criteria for every story: _bmad-output/planning-artifacts/epics.md
#
# LEGACY DEFECTS — SPECIFIED AS NON-GOALS (see prd.md §7). Do not reproduce:
#   - Dead client routes (`Users`, `user`) pointing at views that do not exist.
#   - 13 of the 230 use cases had no server endpoint — client-side only, including role-based menu
#     hiding treated as an authorisation control. In the new system every endpoint authorises.
#   - Duplicate V2/V3/Two capability variants (CheckManagementController, FamilyTwo, ...) — one
#     implementation per capability.
#   - Write endpoints accepting an untyped JObject — the new system uses typed request DTOs.
#
# ARCHITECTURE — binding on every story (see docs/Modules/00-Overview-and-Common-Context.md §2):
#   Clean Architecture + Repository/Service/UnitOfWork. No MediatR, no CQRS.
#   Build order per module: Domain -> Infrastructure -> Application -> API -> Frontend -> Tests -> Docs.
#   FullAuditedEntity / LookupEntity base classes; MappingDefaults schemas; no manual DbSet.
#   Only the UnitOfWork saves; soft delete only; FluentValidation in the service layer.
#   Every endpoint returns Framework.Core.ApiResponse<T> and authorises server-side.
#   Frontend reuses data-list, input-fields and attachment; lazy-loaded modules; ar.json/en.json only.
#
# TERMINOLOGY: the tenant organisation is a CHARITY. "NGO" and "Association" are retired.
#   Epic 3 changed prefix UC-NGO -> UC-CHR (numbering unchanged: UC-NGO-01 = UC-CHR-01) and several
#   story keys were renamed (…-an-association -> …-a-charity).
#
# ROUTING: the route and endpoint on every story below are THIS project's — the Angular 18 route and
#   the ASP.NET Core endpoint. The legacy AngularJS states, /api/* controllers, /Print/* actions and
#   BLL classes have been replaced throughout. Conventions, full crosswalk and known gaps:
#   docs/Modules/00-ROUTING-MAP.md
#

